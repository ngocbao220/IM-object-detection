paths:
  train_data: ./public/annotations/train.json
  val_data: ./public/annotations/val.json
  image_dir: ./public/train/images
  val_image_dir: ./public/val/images
  saved_results_dir: ./saved_results
  checkpoint_dir: null
  resume_from: null

run:
  name: baseline
  use_wandb: true
  wandb_project: object-detection-final
  eval_max_images: 0
  log_interval: 999999 # no logging

model:
  backbone: resnet50
  custom: true
  pretrained_backbone: true
  min_size: 512
  max_size: 768
  anchor_sizes: ""
  anchor_ratios: ""
  score_threshold: 0.5
  eval_score_threshold: 0.05

optim:
  epochs: 50
  batch_size: 4
  num_workers: 0
  lr: 0.001
  lr_scheduler: cosine
  momentum: 0.9
  weight_decay: 0.0005
  lr_milestones: 15,25
  lr_gamma: 0.1
  min_lr: 0.00001
  plateau_patience: 3
  plateau_factor: 0.5

device:
  device: null
  gpu: 1
  gpus: null
  distributed: false

augmentation:
  enabled: false
  horizontal_flip_probability: 0.5
  color_jitter_probability: 0.3
  grayscale_probability: 0.05

oversampling:
  class_name: null
  factor: 1.0

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
